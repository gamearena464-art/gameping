</div><canvas id="feld" width="900" height="1600"></canvas><section class="rangliste"><h2>🏆 DIE BESTEN 20 SPIELER</h2><div class="spalten"><span>Pl.</span><span>Name</span><span>Gaben</span><span>Münzen</span></div><div id="liste"></div><div class="listen-aktion"><button id="neueRundeUnten" type="button">↻ NEUE RUNDE</button><button id="resetListe" type="button">↻ RANGLISTE RESET</button></div></section><div class="verwaltung" id="verwaltung"><label>Team <select id="teamwahl"><option value="m">Girls</option><option value="j">Boys</option></select></label><input id="namewahl" placeholder="Spielername" value="Testperson"><select id="geschenkwahl"></select><input id="mengewahl" type="number" min="1" max="1000" value="1" title="Anzahl"><button id="senden">Testen</button><button id="neu">Neue Runde</button><button id="null">Rangliste löschen</button><button id="mwerfen">Mädchen-Kugel</button><button id="jwerfen">Jungen-Kugel</button><label>Zurücksetzen <select id="automatik"><option value="nie">Nie</option><option value="runde">Je Runde</option><option value="tag">Täglich</option><option value="woche">Wöchentlich</option></select></label></div><div class="info" id="status">Testbetrieb · Verbindung zu TikTok noch nicht eingerichtet</div></main><script>
'use strict';
const GESCHENKE=[{id:'rose',name:'Rose',bild:'🌹',muenzen:1,kugeln:1},{id:'fingerherz',name:'Fingerherz',bild:'🫰',muenzen:5,kugeln:5},{id:'herz',name:'Herz',bild:'❤️',muenzen:1,kugeln:1},{id:'panda',name:'Panda',bild:'🐼',muenzen:5,kugeln:5}];
// Große Geschenke werden als physikalische Kugeln zeitversetzt abgearbeitet. Keine Kugeln gehen verloren.
const $=id=>document.getElementById(id), format=n=>Number(n).toLocaleString('de-DE');
const sicherLaden=()=>{try{return JSON.parse(localStorage.getItem('neonstand_v2'))||{}}catch{return {}}};let daten=Object.assign({runde:1,m:0,j:0,spender:{},automatik:'nie',marke:Date.now()},sicherLaden());let schlange=[],kugeln=[],zeit=0,letzterZeitpunkt=0,ton=null,anzeigeZeit={m:0,j:0},spielSekunden=600,spielBeendet=false,letzteTimerZeit=performance.now();const canvas=$('feld'),ctx=canvas.getContext('2d');
function speichern(){try{localStorage.setItem('neonstand_v2',JSON.stringify(daten))}catch{}}function groesse(){document.documentElement.style.setProperty('--mass',Math.min(innerWidth/900,innerHeight/1600))}addEventListener('resize',groesse);groesse();
function listeZeichnen(){const a=Object.entries(daten.spender).sort((x,y)=>y[1].gaben-x[1].gaben||y[1].muenzen-x[1].muenzen).slice(0,20);$('liste').replaceChildren();for(let i=0;i<20;i++){const [name,d]=a[i]||['—',{gaben:0,muenzen:0}];let z=document.createElement('div');z.className='eintrag';for(const wert of [i+1,name,format(d.gaben),format(d.muenzen)]){let e=document.createElement(i===1?'b':'span');e.textContent=wert;z.append(e)}$('liste').append(z)}}function aktualisieren(){$('runde').textContent=format(daten.runde);$('mp').textContent=format(daten.m);$('jp').textContent=format(daten.j);listeZeichnen();speichern()}
for(const seite of ['links','rechts']){for(const g of GESCHENKE.filter(g=>seite==='links'?['rose','fingerherz'].includes(g.id):['herz','panda'].includes(g.id))){let zeile=document.createElement('div');zeile.className='geschenk';zeile.innerHTML=`<span>${g.bild} ${g.name} <small>${format(g.muenzen)} 🪙</small></span><span class="anzahl">${format(g.kugeln)} ●</span>`;$(seite).append(zeile)}}for(const g of GESCHENKE){let o=document.createElement('option');o.value=g.id;o.textContent=g.bild+' '+g.name;$('geschenkwahl').append(o)}$('automatik').value=daten.automatik;
function applause(){try{const AudioContext=window.AudioContext||window.webkitAudioContext;ton=ton||new AudioContext();if(ton.state==='suspended')ton.resume();for(let i=0;i<6;i++){const n=ton.createBufferSource(),b=ton.createBuffer(1,Math.floor(ton.sampleRate*.055),ton.sampleRate),a=b.getChannelData(0);for(let k=0;k<a.length;k++)a[k]=(Math.random()*2-1)*Math.exp(-k/a.length*7);n.buffer=b;let v=ton.createGain();v.gain.value=.12;n.connect(v).connect(ton.destination);n.start(ton.currentTime+i*.09)}}catch{}}
const emotionen=['freundlich','gelangweilt','neugierig','schlaefrig'];function wechselEmotion(){for(const id of ['robom','roboj']){const el=$(id);if(el.classList.contains('jubel'))continue;el.classList.remove(...emotionen);el.classList.add(emotionen[Math.floor(Math.random()*emotionen.length)])}}wechselEmotion();setInterval(wechselEmotion,4500);
function bot(team,name){let el=$(team==='m'?'robom':'roboj');el.querySelector('.namenslicht').textContent='👏 '+name;el.classList.remove(...emotionen);el.classList.add('jubel');clearTimeout(anzeigeZeit[team]);anzeigeZeit[team]=setTimeout(()=>{el.classList.remove('jubel');wechselEmotion()},5000);applause()}
function geschenk({name='Gast',team='m',geschenk='rose',anzahl=1,muenzen}={}){if(spielBeendet)return;name=String(name).trim().slice(0,42)||'Gast';team=team==='j'?'j':'m';anzahl=Math.max(1,Math.min(1000,Math.floor(Number(anzahl)||1)));let g=GESCHENKE.find(x=>x.id===geschenk||x.name.toLowerCase()===String(geschenk).toLowerCase())||GESCHENKE[0];let kosten=Number.isFinite(Number(muenzen))&&muenzen!=null?Math.max(0,Number(muenzen)):g.muenzen;let s=daten.spender[name]||(daten.spender[name]={gaben:0,muenzen:0});s.gaben+=anzahl;s.muenzen+=kosten*anzahl;schlange.push({team,rest:g.kugeln*anzahl});bot(team,name);aktualisieren()}
function resetListe(){daten.spender={};daten.marke=Date.now();aktualisieren();$('liste').scrollTop=0;}
$('resetListe').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();resetListe();});
document.querySelectorAll('.giftbtn').forEach(btn=>btn.addEventListener('click',()=>{if(spielBeendet){alert('Die Spielrunde ist beendet.');return}geschenk({name:btn.dataset.team==='m'?'Test Girls':'Test Boys',team:btn.dataset.team,geschenk:btn.dataset.gift,anzahl:1})}));
// Tastatur-Test: 1=Rose/Girls, 2=Fingerherz/Girls, 3=Herz/Boys, 4=Panda/Boys.

const tastaturGeschenke = {
  '1': {name:'Tastatur-Test Rose', team:'m', geschenk:'rose', anzahl:1},
  '2': {name:'Tastatur-Test Fingerherz', team:'m', geschenk:'fingerherz', anzahl:1},
  '3': {name:'Tastatur-Test Herz', team:'j', geschenk:'herz', anzahl:1},
  '4': {name:'Tastatur-Test Panda', team:'j', geschenk:'panda', anzahl:1}
};
addEventListener('keydown', e => {
  if (e.repeat || e.ctrlKey || e.altKey || e.metaKey) return;
  const tag = e.target && e.target.tagName;
  if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) return;
  const tikfinityTastaturGeschenke = {
   'F13': {name:'TikFinity Rose', team:'m', geschenk:'rose', anzahl:1},
   'F14': {name:'TikFinity Fingerherz', team:'m', geschenk:'fingerherz', anzahl:1},

   'F16': {name:'TikFinity Panda', team:'j', geschenk:'panda', anzahl:1}
 };
 const aktion = tikfinityTastaturGeschenke[e.key] || tastaturGeschenke[e.key];
  if (!aktion) return;

});

function timerAktualisieren(){const rest=Math.max(0,Math.floor(spielSekunden));const m=Math.floor(rest/60),sec=rest%60;$('countdown').textContent=String(m).padStart(2,'0')+':'+String(sec).padStart(2,'0');if(rest<=0&&!spielBeendet){spielBeendet=true;$('countdown').textContent='00:00';$('countdown').style.color='#ff4057';}}
function resetPruefen(){const d=new Date(),mark=new Date(daten.marke);if((daten.automatik==='tag'&&d.toDateString()!==mark.toDateString())||(daten.automatik==='woche'&&Math.floor((Date.now()-daten.marke)/604800000)>0)){daten.spender={};daten.marke=Date.now();aktualisieren()}}
async function testSenden(d){if(verbunden){try{const r=await fetch('/ereignis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(r.ok)return}catch{}}geschenk(d)}$('senden').onclick=()=>testSenden({name:$('namewahl').value,team:$('teamwahl').value,geschenk:$('geschenkwahl').value,anzahl:$('mengewahl').value});$('mwerfen').onclick=()=>testSenden({name:'Test Girls',team:'m'});$('jwerfen').onclick=()=>testSenden({name:'Test Boys',team:'j'});function neueRundeStarten(){daten.runde++;daten.m=0;daten.j=0;kugeln=[];schlange=[];zeit=0;letzterZeitpunkt=0;spielSekunden=600;spielBeendet=false;$('countdown').style.color='#ffe16b';timerAktualisieren();if(daten.automatik==='runde'){daten.spender={};daten.marke=Date.now()}aktualisieren()}$('neu').onclick=neueRundeStarten;$('neueRundeUnten').addEventListener('click',e=>{e.preventDefault();e.stopPropagation();neueRundeStarten()});$('null').onclick=()=>{if(confirm('Alle 20 Ranglistenplätze und Spielerdaten löschen?')){daten.spender={};daten.marke=Date.now();aktualisieren()}};$('automatik').onchange=e=>{daten.automatik=e.target.value;daten.marke=Date.now();speichern()};resetPruefen();aktualisieren();timerAktualisieren();setInterval(resetPruefen,60000);
const stifte=[];for(let r=0;r<8;r++){const y=570+r*62,anz=4+r,abstand=72,anfang=450-(anz-1)*abstand/2;for(let c=0;c<anz;c++)stifte.push({x:anfang+c*abstand,y})}const faecher=[-100,50,50,25,10,2,2,10,50,50,-100],farben=['#b018eb','#058cff','#048bff','#00d49a','#11e36a','#ffca00','#ffd500','#0cde7b','#02d4d2','#008fff','#e01fdc'];
function neueKugel(team){kugeln.push({x:450+(Math.random()-.5)*18,y:530,vx:(Math.random()-.5)*2,vy:0,team,spur:[]})}
function hintergrund(){ctx.clearRect(0,0,900,1600);ctx.save();ctx.shadowBlur=18;for(let i=0;i<11;i++){let x=18+i*78;ctx.fillStyle=farben[i]+'22';ctx.fillRect(x,1080,76,82);ctx.strokeStyle=farben[i];ctx.lineWidth=2;ctx.shadowColor=farben[i];ctx.strokeRect(x,1080,76,82);ctx.fillStyle='#fff';ctx.shadowBlur=10;ctx.textAlign='center';ctx.font='bold 25px Rajdhani,Arial';ctx.fillText((faecher[i]>0?'+':'')+faecher[i],x+38,1128)}ctx.restore();for(const p of stifte){ctx.fillStyle='#001017';ctx.beginPath();ctx.ellipse(p.x+7,p.y+13,8,20,-.3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=9;ctx.shadowColor='#b8f7ef';ctx.fillStyle='#e3f1f3';ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}}
function bewegen(dt){if(spielBeendet)return;const s=Math.min(2,dt/16.67);for(const k of kugeln){k.vy=Math.min(10,k.vy+.14*s);k.x+=k.vx*s;k.y+=k.vy*s;if(k.x<18||k.x>882){k.vx*=-.8;k.x=Math.max(18,Math.min(882,k.x))}for(const p of stifte){let dx=k.x-p.x,dy=k.y-p.y,dist=Math.hypot(dx,dy);if(dist<17&&dist>0){let nx=dx/dist,ny=dy/dist;k.x=p.x+nx*17;k.y=p.y+ny*17;k.vx=nx*(1.8+Math.random()*1.5)+(Math.random()-.5)*1.8;k.vy=Math.max(1,Math.abs(k.vy)*.65)}}k.spur.push({x:k.x,y:k.y});if(k.spur.length>10)k.spur.shift();if(k.y>1080){let index=Math.max(0,Math.min(10,Math.floor((k.x-18)/78)));daten[k.team]+=faecher[index];k.fertig=true;aktualisieren()}}kugeln=kugeln.filter(k=>!k.fertig)}
function zeichnen(){hintergrund();for(const k of kugeln){let farbe=k.team==='m'?'#ff20ba':'#ff2424';for(let i=0;i<k.spur.length;i++){const p=k.spur[i];ctx.globalAlpha=i/k.spur.length*.5;ctx.fillStyle=farbe;ctx.beginPath();ctx.arc(p.x,p.y,3+i*.5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowColor=farbe;ctx.shadowBlur=24;ctx.fillStyle=farbe;ctx.beginPath();ctx.arc(k.x,k.y,15,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffffa8';ctx.beginPath();ctx.arc(k.x-5,k.y-5,5,0,Math.PI*2);ctx.fill()}}
function schleife(t){const dt=t-(letzterZeitpunkt||t);letzterZeitpunkt=t;if(!spielBeendet){spielSekunden=Math.max(0,spielSekunden-dt/1000);timerAktualisieren()}zeit+=dt;if(!spielBeendet&&zeit>42&&schlange.length){let eintrag=schlange[0];neueKugel(eintrag.team);eintrag.rest--;if(eintrag.rest<=0)schlange.shift();zeit=0}bewegen(dt);zeichnen();requestAnimationFrame(schleife)}requestAnimationFrame(schleife);

let verbunden=false;try{const quelle=new EventSource('/ereignisse');quelle.addEventListener('geschenk',e=>{try{geschenk(JSON.parse(e.data))}catch{}});quelle.onerror=()=>{verbunden=false};quelle.onopen=()=>{verbunden=true;$('status').textContent='Lokale Ereignisbrücke bereit · TikTok-Anbindung separat nötig'}}catch{}
// Optionaler Zugriff für Browserautomatisierung und Tests:
window.neonGeschenk=geschenk;
const parameter=new URLSearchParams(location.search);if(parameter.get('verwaltung')==='1'){$('verwaltung').style.display='flex';$('status').style.display='block'}else{$('verwaltung').classList.add('versteckt');$('status').classList.add('versteckt')}
