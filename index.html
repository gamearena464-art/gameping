:14px;color:#b4cad1}.roboter{position:absolute;top:120px;width:175px;height:125px;z-index:5;animation:schweben 3s ease-in-out infinite}.roboter.l{left:385px}.roboter.r{right:385px;animation-delay:-1.5s}.roboter .kopfteil{width:116px;height:82px;border-radius:32px 32px 26px 26px;margin:auto;background:linear-gradient(135deg,#e5f5ff,#647caa 33%,#09152d 70%,#182f5a);border:5px solid var(--licht);box-shadow:0 0 19px var(--licht),inset 0 0 14px #010a19;position:relative}.roboter .gesicht{position:absolute;inset:12px 8px;background:#020b1b;border-radius:19px;display:flex;align-items:center;justify-content:center;gap:17px}.auge{height:16px;width:12px;border-radius:9px;background:var(--licht);box-shadow:0 0 12px var(--licht)}.roboter .mund{position:absolute;bottom:10px;left:42px;width:24px;height:10px;border-bottom:3px solid var(--licht);border-radius:50%}.roboter .ohr{position:absolute;top:26px;width:18px;height:35px;background:#8194c2;border:3px solid var(--licht);border-radius:10px}.roboter .ohr.a{left:15px}.roboter .ohr.b{right:15px}.roboter .koerper{width:72px;height:30px;margin:-1px auto 0;background:linear-gradient(#9ab3e5,#172848);border-radius:10px 10px 22px 22px;border:2px solid var(--licht)}.roboter .arm{position:absolute;top:83px;font-size:29px;color:var(--licht)}.roboter .arm.a{left:24px}.roboter .arm.b{right:24px}.roboter.jubel .arm{animation:klatschen .25s infinite alternate}.namenslicht{position:absolute;top:18px;left:30px;width:115px;text-align:center;background:#020d1cf0;border:2px solid var(--licht);border-radius:11px;padding:5px;box-shadow:0 0 18px var(--licht);font-size:13px;font-weight:700;z-index:9;opacity:0;transition:opacity .2s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.roboter.jubel .namenslicht{opacity:1}.roboter.jubel .kopfteil{filter:brightness(1.2)}@keyframes schweben{50%{transform:translateY(-9px)}}@keyframes klatschen{from{transform:rotate(-25deg) translateX(-8px)}to{transform:rotate(35deg) translateX(11px)}}#feld{position:absolute;inset:0;z-index:2;pointer-events:none}.rangliste{position:absolute;right:22px;top:503px;width:295px;height:300px;border:1px solid #25c5ff80;background:#031826e8;border-radius:14px;z-index:6;padding:7px 10px;box-shadow:0 0 15px #00aaff25}.rangliste h2{font-size:24px;margin:0;text-align:center;color:#f3faff}.rangliste .spalten{display:grid;grid-template-columns:32px 1fr 58px 58px;color:#9ec7d5;font-size:13px;border-bottom:1px solid #ffffff30}.eintrag{display:grid;grid-template-columns:32px 1fr 58px 58px;gap:0;line-height:12px;font-size:14px;border-bottom:1px solid #ffffff0c;padding:1px 0}.eintrag b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.eintrag:nth-child(1){color:#ffe680}.eintrag:nth-child(2){color:#d6e8f3}.eintrag:nth-child(3){color:#f5b17a}.eintrag span:last-child,.eintrag span:nth-last-child(2){text-align:right}.leiste{position:absolute;bottom:0;left:0;right:0;height:105px;background:#00121df5;border-top:2px solid #ffffff28;z-index:7;display:flex;align-items:center;justify-content:space-around}.knopf{font-family:inherit;font-weight:700;color:white;border-radius:17px;padding:13px 27px;border:3px solid #ff20bb;background:linear-gradient(#ff20bb,#8e075b);box-shadow:0 0 18px #ff20bb88;font-size:29px;cursor:pointer}.knopf.rot{border-color:#ff3349;background:linear-gradient(#ff3e55,#a40723);box-shadow:0 0 18px #ff334988}.leiste .hinweis{font-size:26px;font-weight:700;font-style:italic}.verwaltung{position:absolute;bottom:111px;left:25px;z-index:8;background:#041a27e8;border:1px solid #ffffff33;border-radius:12px;padding:8px 12px;font-size:17px;display:flex;gap:8px;align-items:center}.verwaltung button,.verwaltung select,.verwaltung input{background:#123449;color:white;border:1px solid #6e99ac;border-radius:6px;padding:5px;font:600 15px Rajdhani,Arial;cursor:pointer}.verwaltung input{width:95px}.verwaltung label{display:flex;align-items:center;gap:4px}.info{position:absolute;bottom:115px;left:345px;color:#c4ffec;font-size:17px;z-index:4}.blitz{position:absolute;bottom:150px;left:355px;color:#fff;font-size:20px;z-index:4}.stern{color:#ffe16b}.versteckt{display:none!important}

</style></head><body><main id="buehne"><div class="kopf"><strong class="schrift">RUNDE: <span id="runde">1</span></strong><small>GIRLS GEGEN BOYS</small></div><section class="team maedchen"><h1 class="schrift">GIRLS</h1><div class="punkte schrift">PUNKTE: <span id="mp">0</span></div></section><section class="team jungen"><h1 class="schrift">BOYS</h1><div class="punkte schrift">PUNKTE: <span id="jp">0</span></div></section><section class="geschenke links" id="links"><h2>🎁 GESCHENKE → KUGELN</h2></section><section class="geschenke rechts" id="rechts"><h2>🎁 GESCHENKE → KUGELN</h2></section><div class="roboter l" id="robom" style="--licht:#ff35cc"><div class="namenslicht"></div><div class="ohr a"></div><div class="ohr b"></div><div class="kopfteil"><div class="gesicht"><i class="auge"></i><i class="auge"></i><div class="mund"></div></div></div><div class="koerper"></div><div class="arm a">◕</div><div class="arm b">◕</div></div><div class="roboter r" id="roboj" style="--licht:#ff343e"><div class="namenslicht"></div><div class="ohr a"></div><div class="ohr b"></div><div class="kopfteil"><div class="gesicht"><i class="auge"></i><i class="auge"></i><div class="mund"></div></div></div><div class="koerper"></div><div class="arm a">◕</div><div class="arm b">◕</div></div><canvas id="feld" width="1600" height="900"></canvas><section class="rangliste"><h2>🏆 DIE BESTEN 20 SPIELER</h2><div class="spalten"><span>Pl.</span><span>Name</span><span>Gaben</span><span>Münzen</span></div><div id="liste"></div></section><div class="verwaltung" id="verwaltung"><label>Team <select id="teamwahl"><option value="m">Girls</option><option value="j">Boys</option></select></label><input id="namewahl" placeholder="Spielername" value="Testperson"><select id="geschenkwahl"></select><input id="mengewahl" type="number" min="1" max="1000" value="1" title="Anzahl"><button id="senden">Testen</button><button id="neu">Neue Runde</button><button id="null">Rangliste löschen</button><label>Zurücksetzen <select id="automatik"><option value="nie">Nie</option><option value="runde">Je Runde</option><option value="tag">Täglich</option><option value="woche">Wöchentlich</option></select></label></div><div class="info" id="status">Testbetrieb · Verbindung zu TikTok noch nicht eingerichtet</div><div class="leiste"><span class="hinweis">💗 UNTERSTÜTZE DEIN TEAM!</span><button class="knopf" id="mwerfen">👑 MÄDCHEN-KUGEL</button><button class="knopf rot" id="jwerfen">👑 JUNGEN-KUGEL</button><span class="hinweis">✨ GEMEINSAM MEHR PUNKTE!</span></div></main><script>
'use strict';
const GESCHENKE=[{id:'rose',name:'Rose',bild:'🌹',muenzen:1,kugeln:1},{id:'fingerherz',name:'Fingerherz',bild:'🫰',muenzen:5,kugeln:5},{id:'donut',name:'Donut',bild:'🍩',muenzen:30,kugeln:30},{id:'sonnenbrille',name:'Sonnenbrille',bild:'🕶️',muenzen:199,kugeln:199},{id:'geldpistole',name:'Geldpistole',bild:'💸',muenzen:500,kugeln:500}];
// Große Geschenke werden als physikalische Kugeln zeitversetzt abgearbeitet. Keine Kugeln gehen verloren.
const $=id=>document.getElementById(id), format=n=>Number(n).toLocaleString('de-DE');
const sicherLaden=()=>{try{return JSON.parse(localStorage.getItem('neonstand_v2'))||{}}catch{return {}}};let daten=Object.assign({runde:1,m:0,j:0,spender:{},automatik:'nie',marke:Date.now()},sicherLaden());let schlange=[],kugeln=[],zeit=0,letzterZeitpunkt=0,ton=null,anzeigeZeit={m:0,j:0};const canvas=$('feld'),ctx=canvas.getContext('2d');
function speichern(){try{localStorage.setItem('neonstand_v2',JSON.stringify(daten))}catch{}}function groesse(){document.documentElement.style.setProperty('--mass',Math.min(innerWidth/1600,innerHeight/900))}addEventListener('resize',groesse);groesse();
function listeZeichnen(){const a=Object.entries(daten.spender).sort((x,y)=>y[1].gaben-x[1].gaben||y[1].muenzen-x[1].muenzen).slice(0,20);$('liste').replaceChildren();for(let i=0;i<20;i++){const [name,d]=a[i]||['—',{gaben:0,muenzen:0}];let z=document.createElement('div');z.className='eintrag';for(const wert of [i+1,name,format(d.gaben),format(d.muenzen)]){let e=document.createElement(i===1?'b':'span');e.textContent=wert;z.append(e)}$('liste').append(z)}}function aktualisieren(){$('runde').textContent=format(daten.runde);$('mp').textContent=format(daten.m);$('jp').textContent=format(daten.j);listeZeichnen();speichern()}
for(const seite of ['links','rechts']){for(const g of GESCHENKE){let zeile=document.createElement('div');zeile.className='geschenk';zeile.innerHTML=`<span>${g.bild} ${g.name} <small>${format(g.muenzen)} 🪙</small></span><span class="anzahl">${format(g.kugeln)} ●</span>`;$(seite).append(zeile)}}for(const g of GESCHENKE){let o=document.createElement('option');o.value=g.id;o.textContent=g.bild+' '+g.name;$('geschenkwahl').append(o)}$('automatik').value=daten.automatik;
function applause(){try{const AudioContext=window.AudioContext||window.webkitAudioContext;ton=ton||new AudioContext();if(ton.state==='suspended')ton.resume();for(let i=0;i<6;i++){const n=ton.createBufferSource(),b=ton.createBuffer(1,Math.floor(ton.sampleRate*.055),ton.sampleRate),a=b.getChannelData(0);for(let k=0;k<a.length;k++)a[k]=(Math.random()*2-1)*Math.exp(-k/a.length*7);n.buffer=b;let v=ton.createGain();v.gain.value=.12;n.connect(v).connect(ton.destination);n.start(ton.currentTime+i*.09)}}catch{}}
const emotionen=['freundlich','gelangweilt','neugierig','schlaefrig'];function wechselEmotion(){for(const id of ['robom','roboj']){const el=$(id);if(el.classList.contains('jubel'))continue;el.classList.remove(...emotionen);el.classList.add(emotionen[Math.floor(Math.random()*emotionen.length)])}}wechselEmotion();setInterval(wechselEmotion,4500);
function bot(team,name){let el=$(team==='m'?'robom':'roboj');el.querySelector('.namenslicht').textContent='👏 '+name;el.classList.remove(...emotionen);el.classList.add('jubel');clearTimeout(anzeigeZeit[team]);anzeigeZeit[team]=setTimeout(()=>{el.classList.remove('jubel');wechselEmotion()},5000);applause()}
function geschenk({name='Gast',team='m',geschenk='rose',anzahl=1,muenzen}={}){name=String(name).trim().slice(0,42)||'Gast';team=team==='j'?'j':'m';anzahl=Math.max(1,Math.min(1000,Math.floor(Number(anzahl)||1)));let g=GESCHENKE.find(x=>x.id===geschenk||x.name.toLowerCase()===String(geschenk).toLowerCase())||GESCHENKE[0];let kosten=Number.isFinite(Number(muenzen))&&muenzen!=null?Math.max(0,Number(muenzen)):g.muenzen;let s=daten.spender[name]||(daten.spender[name]={gaben:0,muenzen:0});s.gaben+=anzahl;s.muenzen+=kosten*anzahl;schlange.push({team,rest:g.kugeln*anzahl});bot(team,name);aktualisieren()}
function resetPruefen(){const d=new Date(),mark=new Date(daten.marke);if((daten.automatik==='tag'&&d.toDateString()!==mark.toDateString())||(daten.automatik==='woche'&&Math.floor((Date.now()-daten.marke)/604800000)>0)){daten.spender={};daten.marke=Date.now();aktualisieren()}}
async function testSenden(d){if(verbunden){try{const r=await fetch('/ereignis',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)});if(r.ok)return}catch{}}geschenk(d)}$('senden').onclick=()=>testSenden({name:$('namewahl').value,team:$('teamwahl').value,geschenk:$('geschenkwahl').value,anzahl:$('mengewahl').value});$('mwerfen').onclick=()=>testSenden({name:'Test Girls',team:'m'});$('jwerfen').onclick=()=>testSenden({name:'Test Boys',team:'j'});$('neu').onclick=()=>{if(!confirm('Neue Runde starten und Team-Punkte auf null setzen?'))return;daten.runde++;daten.m=0;daten.j=0;kugeln=[];schlange=[];if(daten.automatik==='runde'){daten.spender={};daten.marke=Date.now()}aktualisieren()};$('null').onclick=()=>{if(confirm('Alle 20 Ranglistenplätze und Spielerdaten löschen?')){daten.spender={};daten.marke=Date.now();aktualisieren()}};$('automatik').onchange=e=>{daten.automatik=e.target.value;daten.marke=Date.now();speichern()};resetPruefen();aktualisieren();setInterval(resetPruefen,60000);
const stifte=[];for(let r=0;r<8;r++){const y=238+r*55,anz=4+r,abstand=73,anfang=800-(anz-1)*abstand/2;for(let c=0;c<anz;c++)stifte.push({x:anfang+c*abstand,y})}const faecher=[-100,50,50,25,10,2,2,10,50,50,-100],farben=['#b018eb','#058cff','#048bff','#00d49a','#11e36a','#ffca00','#ffd500','#0cde7b','#02d4d2','#008fff','#e01fdc'];
function neueKugel(team){kugeln.push({x:800+(Math.random()-.5)*18,y:196,vx:(Math.random()-.5)*2,vy:0,team,spur:[]})}
function hintergrund(){ctx.clearRect(0,0,1600,900);ctx.save();ctx.shadowBlur=18;for(let i=0;i<11;i++){let x=315+i*88;ctx.fillStyle=farben[i]+'22';ctx.fillRect(x,665,84,87);ctx.strokeStyle=farben[i];ctx.lineWidth=3;ctx.shadowColor=farben[i];ctx.strokeRect(x,665,84,87);ctx.fillStyle='#fff';ctx.shadowBlur=10;ctx.textAlign='center';ctx.font='bold 31px Rajdhani,Arial';ctx.fillText((faecher[i]>0?'+':'')+faecher[i],x+42,720)}ctx.restore();for(const p of stifte){ctx.fillStyle='#001017';ctx.beginPath();ctx.ellipse(p.x+7,p.y+13,8,20,-.3,0,Math.PI*2);ctx.fill();ctx.shadowBlur=9;ctx.shadowColor='#b8f7ef';ctx.fillStyle='#e3f1f3';ctx.beginPath();ctx.arc(p.x,p.y,7,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}}
function bewegen(dt){const s=Math.min(2,dt/16.67);for(const k of kugeln){k.vy=Math.min(10,k.vy+.14*s);k.x+=k.vx*s;k.y+=k.vy*s;if(k.x<322||k.x>1270){k.vx*=-.8;k.x=Math.max(322,Math.min(1270,k.x))}for(const p of stifte){let dx=k.x-p.x,dy=k.y-p.y,dist=Math.hypot(dx,dy);if(dist<17&&dist>0){let nx=dx/dist,ny=dy/dist;k.x=p.x+nx*17;k.y=p.y+ny*17;k.vx=nx*(1.8+Math.random()*1.5)+(Math.random()-.5)*1.8;k.vy=Math.max(1,Math.abs(k.vy)*.65)}}k.spur.push({x:k.x,y:k.y});if(k.spur.length>10)k.spur.shift();if(k.y>672){let index=Math.max(0,Math.min(10,Math.floor((k.x-315)/88)));daten[k.team]+=faecher[index];k.fertig=true;aktualisieren()}}kugeln=kugeln.filter(k=>!k.fertig)}
function zeichnen(){hintergrund();for(const k of kugeln){let farbe=k.team==='m'?'#ff20ba':'#ff2424';for(let i=0;i<k.spur.length;i++){const p=k.spur[i];ctx.globalAlpha=i/k.spur.length*.5;ctx.fillStyle=farbe;ctx.beginPath();ctx.arc(p.x,p.y,3+i*.5,0,Math.PI*2);ctx.fill()}ctx.globalAlpha=1;ctx.shadowColor=farbe;ctx.shadowBlur=24;ctx.fillStyle=farbe;ctx.beginPath();ctx.arc(k.x,k.y,15,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0;ctx.fillStyle='#ffffffa8';ctx.beginPath();ctx.arc(k.x-5,k.y-5,5,0,Math.PI*2);ctx.fill()}}
function schleife(t){const dt=t-(letzterZeitpunkt||t);letzterZeitpunkt=t;zeit+=dt;if(zeit>42&&schlange.length){let eintrag=schlange[0];neueKugel(eintrag.team);eintrag.rest--;if(eintrag.rest<=0)schlange.shift();zeit=0}bewegen(dt);zeichnen();requestAnimationFrame(schleife)}requestAnimationFrame(schleife);
// Für eine lokale Ereignisbrücke: POST /ereignis am mitgelieferten Python-Server.
let verbunden=false;try{const quelle=new EventSource('/ereignisse');quelle.addEventListener('geschenk',e=>{try{geschenk(JSON.parse(e.data))}catch{}});quelle.onerror=()=>{verbunden=false};quelle.onopen=()=>{verbunden=true;$('status').textContent='Lokale Ereignisbrücke bereit · TikTok-Anbindung separat nötig'}}catch{}
// Optionaler Zugriff für Browserautomatisierung und Tests:
window.neonGeschenk=geschenk;
if(new URLSearchParams(location.search).get('anzeige')==='1'){$('verwaltung').classList.add('versteckt');$('status').classList.add('versteckt')}
</script></body></html>
